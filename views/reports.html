<div class="container-fluid py-4">
  <h2 class="fw-bold mb-4">التقارير</h2>
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label text-muted">نوع التقرير</label>
          <select class="form-select" id="reportType">
            <option value="sales">تقرير المبيعات</option>
            <option value="profit">تقرير الأرباح</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label text-muted">من تاريخ</label>
          <input type="date" class="form-control" id="reportDateFrom">
        </div>
        <div class="col-md-2">
          <label class="form-label text-muted">إلى تاريخ</label>
          <input type="date" class="form-control" id="reportDateTo">
        </div>
        <div class="col-md-2">
          <label class="form-label text-muted">المتجر</label>
          <select class="form-select" id="reportStore">
            <option value="">جميع المتاجر</option>
            <option value="shein">SHEIN</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label text-muted">العملة</label>
          <select class="form-select" id="reportCurrency">
            <option value="">جميع العملات</option>
            <option value="SAR">ريال سعودي</option>
          </select>
        </div>
        <div class="col-md-1 d-flex align-items-end">
          <button class="btn btn-primary w-100 shadow-sm" onclick="window.app.showNotification('سيتم تطوير التقارير لاحقًا', 'info')">
            <i class="fas fa-chart-bar"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
