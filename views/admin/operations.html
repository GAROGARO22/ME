<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل العمليات - معراج</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body class="bg-light">
    <div class="container-fluid p-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bold mb-3">
                    <i class="fas fa-history text-primary me-2"></i>
                    سجل العمليات
                </h2>
                <div class="d-flex gap-2">
                    <button id="refreshOpsBtn" class="btn btn-primary">
                        <i class="fas fa-sync-alt me-2"></i>
                        تحديث
                    </button>
                    <button id="clearLogsBtn" class="btn btn-danger">
                        <i class="fas fa-trash me-2"></i>
                        مسح السجل
                    </button>
                </div>
            </div>
        </div>

        <!-- فلاتر البحث -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">نوع العملية</label>
                        <select class="form-select" id="filterType">
                            <option value="">الكل</option>
                            <option value="create">إنشاء</option>
                            <option value="update">تعديل</option>
                            <option value="delete">حذف</option>
                            <option value="login">تسجيل دخول</option>
                            <option value="logout">تسجيل خروج</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">المستخدم</label>
                        <input type="text" class="form-control" id="filterUser" placeholder="البريد الإلكتروني">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">من تاريخ</label>
                        <input type="date" class="form-control" id="filterFromDate">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">إلى تاريخ</label>
                        <input type="date" class="form-control" id="filterToDate">
                    </div>
                </div>
            </div>
        </div>

        <!-- جدول العمليات -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th>التاريخ والوقت</th>
                                        <th>نوع العملية</th>
                                        <th>المستخدم</th>
                                        <th>الوحدة</th>
                                        <th>التفاصيل</th>
                                        <th>الحالة</th>
                                        <th>الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody id="operationsTableBody">
                                    <tr>
                                        <td colspan="7" class="text-center py-4">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">جاري التحميل...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal تفاصيل العملية -->
    <div class="modal fade" id="operationDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">تفاصيل العملية</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Request:</label>
                        <pre class="bg-light p-3 rounded" id="operationRequest" style="max-height: 200px; overflow-y: auto;"></pre>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Response:</label>
                        <pre class="bg-light p-3 rounded" id="operationResponse" style="max-height: 200px; overflow-y: auto;"></pre>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/app.js" type="module"></script>
    <script src="../js/controllers/admin/operationsController.js" type="module"></script>
</body>
</html>
