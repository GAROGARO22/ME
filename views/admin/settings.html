<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات النظام - معراج</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body class="bg-light">
    <div class="container-fluid p-4">
        <h2 class="fw-bold mb-4">
            <i class="fas fa-cogs text-primary me-2"></i>
            إعدادات النظام
        </h2>

        <div class="row g-4">
            <!-- إعدادات المستخدمين -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-users me-2"></i>إعدادات المستخدمين</h5>
                    </div>
                    <div class="card-body">
                        <form id="usersSettingsForm">
                            <div class="mb-3 form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="allowRegistration">
                                <label class="form-check-label" for="allowRegistration">السماح بالتسجيل الجديد</label>
                            </div>
                            <div class="mb-3 form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="requireEmailVerification">
                                <label class="form-check-label" for="requireEmailVerification">التحقق من البريد الإلكتروني إلزامي</label>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">الحد الأقصى للمستخدمين النشطين</label>
                                <input type="number" class="form-control" id="maxActiveUsers">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>حفظ الإعدادات
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- إعدادات العملات -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-coins me-2"></i>إعدادات العملات</h5>
                    </div>
                    <div class="card-body">
                        <form id="currencySettingsForm">
                            <div class="mb-3">
                                <label class="form-label">العملة الافتراضية</label>
                                <select class="form-select" id="defaultCurrency">
                                    <option value="SAR">ريال سعودي (SAR)</option>
                                    <option value="USD">دولار أمريكي (USD)</option>
                                    <option value="EUR">يورو (EUR)</option>
                                </select>
                            </div>
                            <hr>
                            <h6>أسعار الصرف (بالنسبة لـ SAR)</h6>
                            <div class="mb-2 row">
                                <label class="col-sm-4 col-form-label">USD</label>
                                <div class="col-sm-8">
                                    <input type="number" step="0.0001" class="form-control" id="usdRate">
                                </div>
                            </div>
                            <div class="mb-2 row">
                                <label class="col-sm-4 col-form-label">EUR</label>
                                <div class="col-sm-8">
                                    <input type="number" step="0.0001" class="form-control" id="eurRate">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success mt-3">
                                <i class="fas fa-save me-2"></i>حفظ أسعار الصرف
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- إعدادات اللغة والبلدان -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-globe me-2"></i>اللغة والبلدان</h5>
                    </div>
                    <div class="card-body">
                        <form id="localeSettingsForm">
                            <div class="mb-3">
                                <label class="form-label">اللغة الافتراضية</label>
                                <select class="form-select" id="defaultLanguage">
                                    <option value="ar">العربية</option>
                                    <option value="en">English</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">البلدان المفعلة</label>
                                <div class="border rounded p-2" style="max-height: 200px; overflow-y: auto;">
                                    <div class="form-check">
                                        <input class="form-check-input country-check" type="checkbox" value="SA" checked>
                                        <label class="form-check-label">السعودية</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input country-check" type="checkbox" value="AE" checked>
                                        <label class="form-check-label">الإمارات</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input country-check" type="checkbox" value="EG" checked>
                                        <label class="form-check-label">مصر</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input country-check" type="checkbox" value="KW">
                                        <label class="form-check-label">الكويت</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input country-check" type="checkbox" value="QA">
                                        <label class="form-check-label">قطر</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input country-check" type="checkbox" value="BH">
                                        <label class="form-check-label">البحرين</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input country-check" type="checkbox" value="OM">
                                        <label class="form-check-label">عمان</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input country-check" type="checkbox" value="JO">
                                        <label class="form-check-label">الأردن</label>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-info text-white">
                                <i class="fas fa-save me-2"></i>حفظ الإعدادات
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- إعدادات النظام العامة -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0"><i class="fas fa-sliders-h me-2"></i>إعدادات عامة</h5>
                    </div>
                    <div class="card-body">
                        <form id="generalSettingsForm">
                            <div class="mb-3">
                                <label class="form-label">اسم التطبيق</label>
                                <input type="text" class="form-control" id="appName" value="معراج">
                            </div>
                            <div class="mb-3 form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="enableNotifications">
                                <label class="form-check-label" for="enableNotifications">تفعيل الإشعارات</label>
                            </div>
                            <div class="mb-3 form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="enableAutoSync">
                                <label class="form-check-label" for="enableAutoSync">المزامنة التلقائية مع Gmail</label>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">فترة الاحتفاظ بالسجلات (أيام)</label>
                                <input type="number" class="form-control" id="logRetentionDays" value="90">
                            </div>
                            <button type="submit" class="btn btn-warning text-dark">
                                <i class="fas fa-save me-2"></i>حفظ الإعدادات العامة
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- قسم النسخ الاحتياطي -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="fas fa-database me-2"></i>النسخ الاحتياطي والاستعادة</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <h6>نسخ احتياطي للبيانات</h6>
                                <p class="text-muted small">قم بتنزيل نسخة احتياطية من جميع بياناتك</p>
                                <button id="backupBtn" class="btn btn-outline-danger">
                                    <i class="fas fa-download me-2"></i>تنزيل نسخة احتياطية
                                </button>
                            </div>
                            <div class="col-md-6">
                                <h6>استعادة البيانات</h6>
                                <p class="text-muted small">قم برفع ملف النسخة الاحتياطية للاستعادة</p>
                                <input type="file" class="form-control mb-2" id="restoreFile" accept=".json">
                                <button id="restoreBtn" class="btn btn-outline-primary">
                                    <i class="fas fa-upload me-2"></i>استعادة من نسخة
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/app.js" type="module"></script>
    <script src="../js/controllers/admin/settingsController.js" type="module"></script>
</body>
</html>
