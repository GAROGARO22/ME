<div class="container-fluid py-4">
  <h2 class="fw-bold mb-4">الملف الشخصي</h2>
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form id="profileForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">الاسم</label>
            <input type="text" class="form-control" id="profileName" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">الهاتف</label>
            <input type="tel" class="form-control" id="profilePhone">
          </div>
          <div class="col-md-6">
            <label class="form-label">المتجر</label>
            <input type="text" class="form-control" id="profileStore" placeholder="مثال: SHEIN">
          </div>
          <div class="col-md-6">
            <label class="form-label">البريد</label>
            <input type="email" class="form-control" id="profileEmail" disabled>
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-4">حفظ التغييرات</button>
      </form>
    </div>
  </div>
</div>
